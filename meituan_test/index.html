<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>合租生活管家</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">合租生活管家</p>
          <h1>Roomie Hub</h1>
        </div>
        <button id="reset-demo" class="secondary-btn">重置演示数据</button>
      </header>

      <main class="content">
        <section class="summary-grid" id="summary-grid"></section>

        <section class="panel wide">
          <div class="panel-header">
            <h2>本月费用AA分摊</h2>
            <button class="primary-btn" id="add-bill">新增费用</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>费用项目</th>
                  <th>金额</th>
                  <th>分摊方式</th>
                  <th>待支付</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="bill-table-body"></tbody>
            </table>
          </div>
        </section>

        <section class="panels-grid">
          <article class="panel">
            <div class="panel-header">
              <h2>清洁值日排班</h2>
              <button class="primary-btn" id="rotate-schedule">下一轮排班</button>
            </div>
            <div id="schedule-list" class="stack-list"></div>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h2>公共物品登记</h2>
              <button class="primary-btn" id="add-item">新增物品</button>
            </div>
            <div id="items-list" class="stack-list"></div>
          </article>
        </section>

        <section class="panel wide">
          <div class="panel-header">
            <h2>室友公约管理</h2>
            <button class="primary-btn" id="add-rule">新增公约</button>
          </div>
          <ul id="rules-list" class="rules-list"></ul>
        </section>
      </main>
    </div>

    <template id="bill-row-template">
      <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td><span class="status-pill"></span></td>
      </tr>
    </template>

    <script src="script.js"></script>
  </body>
</html>
